    <path d="M-58 72V24c0-49 116-49 116 0v48" fill="none" stroke="#82aaff" stroke-width="18"/>
    <circle cx="0" cy="130" r="18" fill="#4fe1c1"/>
    <path d="M0 130v38" stroke="#4fe1c1" stroke-width="10" stroke-linecap="round"/>
    <path d="M-146 136h-77M146 136h77M-184 136v-44M184 136v-44" fill="none" stroke="#4fe1c1" stroke-width="4"/>
    <circle cx="-223" cy="92" r="12" fill="#4fe1c1"/><circle cx="223" cy="92" r="12" fill="#4fe1c1"/>
  </g>
  <text x="725" y="300" fill="#dce8ff" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="4">AUTHORIZED LAB ONLY</text>
