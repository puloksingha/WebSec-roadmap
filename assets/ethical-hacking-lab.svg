<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ethical hacking laboratory</title>
  <desc id="desc">A terminal window, a lock, and a laboratory network used for authorized security testing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121827"/>
      <stop offset="1" stop-color="#25213d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b2b42"/>
      <stop offset="1" stop-color="#293b59"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect x="58" y="52" width="575" height="260" rx="16" fill="#0b111c" stroke="#4fe1c1" stroke-width="3"/>
  <rect x="58" y="52" width="575" height="42" rx="16" fill="#17283a"/>
  <circle cx="88" cy="73" r="7" fill="#ff6d7a"/><circle cx="112" cy="73" r="7" fill="#ffd166"/><circle cx="136" cy="73" r="7" fill="#4fe1c1"/>
  <g font-family="monospace" font-size="22">
    <text x="92" y="137" fill="#4fe1c1">$ scope --target lab.local</text>
    <text x="92" y="177" fill="#a9c7e8">[+] authorization verified</text>
    <text x="92" y="217" fill="#a9c7e8">[+] evidence captured</text>
    <text x="92" y="257" fill="#ffcf70">[!] report: remediation ready</text>
  </g>
  <g transform="translate(805 82)">
